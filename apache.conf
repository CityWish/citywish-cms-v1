<VirtualHost *:80>
	ServerName citywish.fr
	ServerAlias www.citywish.fr
	DocumentRoot /var/www/citywish/
	<Directory />
		Options FollowSymLinks
		AllowOverride None
	</Directory>
	<Directory /var/www/citywish/>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Order allow,deny
		allow from all
	</Directory>

	ErrorLog /var/www/citywish/log/error.log

	# Possible values include: debug, info, notice, warn, error, crit,
	# alert, emerg.
	LogLevel warn

	CustomLog /var/www/citywish/log/access.log combined
</VirtualHost>

